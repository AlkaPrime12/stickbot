services:
  postgres:
    image: postgres:16-alpine
    profiles:
      - postgres
    environment:
      POSTGRES_USER: stickbot
      POSTGRES_PASSWORD: stickbot
      POSTGRES_DB: stickbot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    command: python run_web.py
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./:/app
      - ./data:/app/data

  bot:
    build: .
    command: python run_bot.py
    env_file:
      - .env
    depends_on:
      - web
    volumes:
      - ./:/app
      - ./data:/app/data

volumes:
  pgdata: {}
