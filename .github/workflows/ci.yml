name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stickbot
          POSTGRES_PASSWORD: stickbot
          POSTGRES_DB: stickbot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stickbot -d stickbot_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://stickbot:stickbot@localhost:5432/stickbot_ci

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Alembic migrate
        run: alembic upgrade head
      - name: Pytest (unit + Postgres smoke)
        run: pytest -q tests/
